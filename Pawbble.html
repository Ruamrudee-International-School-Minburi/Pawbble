<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4effd">
<title>Pawbble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff7aa8;--pink-d:#e9508a;--sage:#c4cfa1;--plum:#2f2140;--lilac:#f4effd;--mint:#7fdcc4;--butter:#ffd56b;--sky:#9fd3ff;--coral:#ff9178;
  --ink:#2f2140;--ink-2:#6f6084;--panel:rgba(255,251,255,.95);--panel-2:#f3ecfc;--tile:#ffffff;--btn:#ffffff;--btn-sh:#dccdf0;--stroke:rgba(47,33,64,.12);
  --menu-a:rgba(244,239,253,.94);--menu-b:rgba(244,239,253,.5);--menu-c:rgba(244,239,253,0);
  --font:"Fredoka","Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
  --pixel:"Silkscreen","Courier New",monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--ink:#f6efff;--ink-2:#c3b4d8;--panel:rgba(38,28,54,.95);--panel-2:#33284a;--tile:#3a2e52;--btn:#43365e;--btn-sh:#251c36;--stroke:rgba(255,255,255,.12);--lilac:#1c152b;--menu-a:rgba(28,21,43,.94);--menu-b:rgba(28,21,43,.55);--menu-c:rgba(28,21,43,0)}
}
:root[data-theme="dark"]{color-scheme:dark;--ink:#f6efff;--ink-2:#c3b4d8;--panel:rgba(38,28,54,.95);--panel-2:#33284a;--tile:#3a2e52;--btn:#43365e;--btn-sh:#251c36;--stroke:rgba(255,255,255,.12);--lilac:#1c152b;--menu-a:rgba(28,21,43,.94);--menu-b:rgba(28,21,43,.55);--menu-c:rgba(28,21,43,0)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--lilac);font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:var(--font);-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#world,#devc{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#devc{z-index:6;pointer-events:none;opacity:0;transition:opacity .35s ease}
#devc.show{opacity:1}
#devc.live{pointer-events:auto;cursor:grab}
#blur{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .35s ease;background:radial-gradient(ellipse at 50% 45%,rgba(40,24,64,.08),rgba(40,24,64,.5));-webkit-backdrop-filter:blur(9px) saturate(1.15);backdrop-filter:blur(9px) saturate(1.15)}
#blur.show{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:600 13px/1 var(--font);color:#fff;background:rgba(47,33,64,.74);padding:5px 10px;border-radius:99px;white-space:nowrap;will-change:transform}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:210px;background:#fff;color:#2f2140;font:500 14px/1.25 var(--font);padding:8px 12px;border-radius:16px;box-shadow:0 6px 16px rgba(47,33,64,.25);will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}

/* ---------- buttons ---------- */
.btn{appearance:none;border:none;cursor:pointer;font:600 16px/1 var(--font);color:var(--ink);background:var(--btn);padding:14px 20px;border-radius:18px;box-shadow:0 4px 0 var(--btn-sh),0 10px 20px -12px rgba(47,33,64,.45);transition:transform .08s,box-shadow .08s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh),0 6px 14px -12px rgba(47,33,64,.45)}
.btn.pri{background:linear-gradient(180deg,#ff97bd,#ff6c9f);color:#fff;box-shadow:0 4px 0 #d64a82,0 12px 24px -12px rgba(214,74,130,.8)}
.btn.pri:active{box-shadow:0 1px 0 #d64a82,0 6px 14px -12px rgba(214,74,130,.8)}
.btn.mint{background:linear-gradient(180deg,#a6f2de,#6dd6bb);color:#123a30;box-shadow:0 4px 0 #42ae93,0 12px 24px -12px rgba(66,174,147,.7)}
.btn.mint:active{box-shadow:0 1px 0 #42ae93}
.btn.warn{background:linear-gradient(180deg,#ffa3ae,#ff6b81);color:#fff;box-shadow:0 4px 0 #d9485f}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.icon{width:46px;height:46px;padding:0;border-radius:50%}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:14px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn svg{width:22px;height:22px;flex:none}
svg.i{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}

/* ---------- sheets & modals ---------- */
.scrim{position:absolute;inset:0;z-index:19;background:rgba(36,22,58,.38);animation:fade .25s}
.sheet{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(100vw - 32px));max-height:min(86vh,780px);display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:30px;box-shadow:0 30px 80px -24px rgba(47,33,64,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:pop .3s cubic-bezier(.2,1.35,.4,1)}
.sheet.sm{width:min(470px,calc(100vw - 32px))}
.sheet.md{width:min(640px,calc(100vw - 32px))}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:20px 18px 8px 24px}
.sh-head .tt{flex:1;min-width:0}
.sh-head h2{margin:0;font:700 26px/1.1 var(--font)}
.sh-sub{color:var(--ink-2);font:400 15px/1.4 var(--font);margin:6px 0 0}
.sh-body{overflow:auto;padding:8px 24px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.sh-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 24px 20px;flex-wrap:wrap}
@media (orientation:portrait) and (max-width:760px){
  .sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;max-height:86%;border-radius:28px 28px 0 0;padding-bottom:var(--sab);animation:up .32s cubic-bezier(.2,1,.3,1)}
  .sheet.sm,.sheet.md{width:auto}
  .sh-head h2{font-size:23px}
}
@media (orientation:landscape) and (max-height:560px){
  .sheet{max-height:calc(100vh - 20px - var(--sat) - var(--sab))}
  .sh-head{padding:14px 14px 4px 20px}.sh-head h2{font-size:21px}
  .sh-body{padding:6px 20px 16px}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{border:2px solid var(--stroke);background:var(--tile);border-radius:99px;padding:9px 14px;font:500 15px/1 var(--font);color:var(--ink);cursor:pointer}
.cb.on{border-color:var(--pink);background:#ffe9f2;color:#b42f68}
.cb[disabled]{opacity:.45}
.cb .lock{font-size:12px;opacity:.7;margin-left:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 24px 10px;touch-action:pan-x;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.lbl{font:600 14px/1.2 var(--font);color:var(--ink-2);margin:16px 0 8px}
.row{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.row > .k{flex:0 0 96px;font:600 15px/1.2 var(--font);color:var(--ink-2)}
.swatch{width:46px;height:46px;border-radius:15px;border:3px solid #fff;box-shadow:0 0 0 2px var(--stroke),0 6px 12px -6px rgba(47,33,64,.45);background:var(--sw);cursor:pointer;flex:none;padding:0}
.quick{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.quick i{width:26px;height:26px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--stroke);cursor:pointer;display:block}
.wheel-ico{width:26px;height:26px;border-radius:50%;background:conic-gradient(#ff6b6b,#ffd56b,#7fdc8c,#6bc7ff,#a78bff,#ff6bd5,#ff6b6b);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--stroke);cursor:pointer;display:block}
input.txt{font:500 17px/1 var(--font);padding:12px 14px;border-radius:14px;border:2px solid var(--stroke);background:var(--tile);color:var(--ink);width:100%;touch-action:manipulation;user-select:text;-webkit-user-select:text}
input[type=range]{touch-action:manipulation}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:var(--panel-2);outline:none}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--pink);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--pink);border:4px solid #fff}

/* ---------- grid tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;background:var(--tile);border-radius:22px;padding:10px 10px 12px;box-shadow:0 2px 0 var(--stroke),0 12px 24px -18px rgba(47,33,64,.5);display:flex;flex-direction:column;gap:6px;cursor:pointer;border:2px solid transparent;color:var(--ink);text-align:left;font-family:var(--font)}
.tile:active{transform:scale(.98)}
.tile.sel{border-color:var(--pink)}
.tile .thumb{aspect-ratio:1/1;border-radius:16px;background:radial-gradient(circle at 50% 38%,#ffffff,#efe6fb);display:grid;place-items:center;overflow:hidden}
.tile .thumb img,.tile .thumb canvas{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.tile .nm{font:600 15px/1.2 var(--font)}
.tile .ds{font:400 13px/1.35 var(--font);color:var(--ink-2)}
.tile .own{font:500 12px/1 var(--font);color:#2e9a78}
.price{position:absolute;top:8px;right:8px;transform:rotate(4deg);background:var(--butter);color:#4a3200;font:400 13px/1 var(--pixel);padding:6px 8px;border-radius:9px;box-shadow:0 2px 0 #e0b23f;z-index:1}
.price.no{background:#ffd2d9;box-shadow:0 2px 0 #f0a3b0}

/* ---------- loading & fade ---------- */
#loading{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:var(--lilac);transition:opacity .5s}
#loading .egg{width:74px;height:90px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,#fff 0 12%,transparent 34%),var(--pink);animation:shake 1.1s infinite;box-shadow:inset 0 -8px 14px rgba(0,0,0,.15)}
#loading p{font:500 16px/1.4 var(--font);color:var(--ink-2);text-align:center;margin:18px 0 0}
#fade{position:absolute;inset:0;z-index:90;background:#241838;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1;pointer-events:auto}

/* ---------- main menu ---------- */
#menu{position:absolute;inset:0;z-index:10;display:grid;grid-template-columns:minmax(330px,1fr) 1.1fr;pointer-events:none;background:linear-gradient(90deg,var(--menu-a) 0%,var(--menu-b) 36%,var(--menu-c) 62%)}
.menu-left{pointer-events:auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(28px + var(--sat)) 30px calc(28px + var(--sab)) calc(52px + var(--sal));max-width:540px}
.logo{display:flex;font:700 clamp(66px,10.5vw,128px)/.92 var(--font);letter-spacing:-.01em;margin:0}
.logo span{display:inline-block;color:var(--c);--o:#2f2140;text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px 2px var(--o),2px -2px var(--o),-2px -2px var(--o),0 8px var(--o),3px 8px var(--o),-3px 8px var(--o),0 18px 30px rgba(47,33,64,.3);animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
.tagline{font:400 clamp(17px,1.8vw,21px)/1.45 var(--font);color:var(--ink-2);max-width:31ch;margin:0}
.menu-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:6px}
.menu-btns .btn{justify-content:flex-start;padding:16px 22px;font-size:18px}
.menu-btns .btn small{font:400 13px/1 var(--font);opacity:.75;margin-left:auto}
.menu-foot{font:400 13px/1.4 var(--font);color:var(--ink-2);opacity:.85}
@media (orientation:portrait){
  #menu{grid-template-columns:1fr;grid-template-rows:40% 1fr;background:linear-gradient(0deg,var(--menu-a) 0%,var(--menu-a) 42%,var(--menu-c) 68%)}
  .menu-left{grid-row:2;justify-content:flex-start;align-items:center;text-align:center;padding:4px 22px calc(20px + var(--sab));margin:0 auto;gap:14px;overflow:auto;touch-action:pan-y}
  .logo{font-size:clamp(58px,17vw,96px)}
  .menu-btns .btn{justify-content:center}
  .menu-btns .btn small{margin-left:8px}
}
@media (orientation:landscape) and (max-height:540px){
  .logo{font-size:58px}.menu-left{gap:9px;padding-top:calc(12px + var(--sat));padding-bottom:calc(12px + var(--sab))}
  .menu-btns{gap:8px}.menu-btns .btn{padding:11px 18px;font-size:16px}.tagline{font-size:15px}
}

/* ---------- slots ---------- */
.slot{display:flex;gap:14px;align-items:center;background:var(--tile);border-radius:22px;padding:14px;margin:0 0 12px;box-shadow:0 2px 0 var(--stroke)}
.slot .ic{width:56px;height:66px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.8),transparent 34%),var(--sw,#ddd);flex:none;box-shadow:inset 0 -6px 10px rgba(0,0,0,.15)}
.slot .inf{flex:1;min-width:0}
.slot .inf b{display:block;font:600 18px/1.2 var(--font)}
.slot .inf span{display:block;font:400 14px/1.4 var(--font);color:var(--ink-2)}
.slot .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cloud{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--font);color:#2e9a78;margin-top:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4}
.hud-top{position:absolute;left:calc(12px + var(--sal));top:calc(10px + var(--sat));display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 200px)}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:99px;font:400 15px/1 var(--pixel);color:#28301d;background:linear-gradient(180deg,#d3ddb2,#bac697);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.08),0 8px 18px -8px rgba(47,33,64,.45)}
.chip .coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd24a 45%,#e8a92a);box-shadow:inset 0 -2px 0 rgba(150,90,0,.35);display:grid;place-items:center;font:700 13px/1 var(--font);color:#8a5a00}
.chip .sun{width:26px;height:26px;display:grid;place-items:center;color:#3b4428}
.chip .day{opacity:.7;margin-left:2px}
.hud-tr{position:absolute;right:calc(12px + var(--sar));top:calc(10px + var(--sat));display:flex;gap:8px;pointer-events:auto}
.hud-tr .btn.icon{width:44px;height:44px;background:rgba(255,255,255,.9);color:#2f2140}
#areaName{position:absolute;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);font:700 28px/1 var(--font);color:#fff;text-shadow:0 3px 0 rgba(47,33,64,.6),0 10px 24px rgba(47,33,64,.4);opacity:0;transition:opacity .6s;white-space:nowrap}
#areaName.show{opacity:1}
#prompt{position:absolute;left:50%;bottom:calc(160px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:99px;background:rgba(47,33,64,.85);color:#fff;font:600 16px/1 var(--font);pointer-events:auto;cursor:pointer;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
#prompt kbd{display:grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:11px;background:#fff;color:#2f2140;font:700 15px/1 var(--font)}
#devBtn{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));width:106px;height:126px;border:none;padding:0;background:none;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 12px 14px rgba(47,33,64,.38));transition:transform .15s}
#devBtn:active{transform:scale(.95)}
#devBtn .shell{position:absolute;inset:0;border-radius:50% 50% 47% 47%/58% 58% 42% 42%;background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 30%),radial-gradient(circle at 60% 110%,rgba(0,0,0,.18),rgba(0,0,0,0) 55%),var(--shell,#ff7aa8)}
#devBtn canvas{position:absolute;left:50%;top:27%;width:64px;height:56px;transform:translateX(-50%);border-radius:9px;border:4px solid rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(47,33,64,.35);image-rendering:pixelated;background:#c7d2a4}
#devBtn .dots{position:absolute;left:50%;top:78%;transform:translateX(-50%);display:flex;gap:9px}
#devBtn .dots i{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
#devBtn .dots i:nth-child(2){transform:translateY(3px)}
#devBtn .badge{position:absolute;top:-6px;right:-4px;width:32px;height:32px;border-radius:50%;background:#ff4f6d;color:#fff;font:700 19px/32px var(--font);text-align:center;display:none;box-shadow:0 0 0 3px #fff}
#devBtn.alert .badge{display:block;animation:pulse .9s infinite}
#devBtn.alert{animation:shake .7s infinite}
#devBtn kbd{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:#2f2140;color:#fff;font:600 12px/1 var(--font);padding:5px 8px;border-radius:8px}
.touch #devBtn kbd,.touch #prompt kbd{display:none}
.touch #prompt{padding:12px 20px}
#reqMini{position:absolute;left:calc(12px + var(--sal));top:calc(58px + var(--sat));background:rgba(255,255,255,.82);color:#2f2140;border-radius:16px;padding:8px 12px;font:500 13px/1.35 var(--font);max-width:240px;pointer-events:auto;cursor:pointer;box-shadow:0 8px 18px -10px rgba(47,33,64,.45)}
#reqMini b{font-weight:600}
#reqMini .pb{height:5px;border-radius:9px;background:#eadff7;margin-top:4px;overflow:hidden}
#reqMini .pb i{display:block;height:100%;background:var(--pink);border-radius:9px}
@media (max-width:560px), (max-height:520px){#reqMini{display:none}}

/* touch */
#touchUI{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:0;top:0;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);pointer-events:none;opacity:.55;transition:opacity .2s}
#joy.on{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 14px rgba(47,33,64,.3)}
.tbtn{position:absolute;pointer-events:auto;border:none;border-radius:50%;width:66px;height:66px;background:rgba(255,255,255,.9);color:#2f2140;box-shadow:0 8px 18px -8px rgba(47,33,64,.5);display:grid;place-items:center;font:600 12px/1 var(--font);padding:0}
.tbtn svg{width:28px;height:28px}
.tbtn:active,.tbtn.on{transform:scale(.94);background:#fff}
#actBtn{right:calc(132px + var(--sar));bottom:calc(22px + var(--sab));width:80px;height:80px;background:linear-gradient(180deg,#ff97bd,#ff6c9f);color:#fff}
#actBtn.dim{opacity:.45}
#hopBtn{right:calc(146px + var(--sar));bottom:calc(116px + var(--sab));width:56px;height:56px}
#runBtn{right:calc(30px + var(--sar));bottom:calc(158px + var(--sab));width:56px;height:56px}

/* ---------- device view ---------- */
#devUI{position:absolute;inset:0;z-index:7;pointer-events:none}
#devUI .dtop{position:absolute;top:calc(12px + var(--sat));left:calc(14px + var(--sal));right:calc(14px + var(--sar));display:flex;align-items:center;gap:10px}

.abc{position:absolute;left:50%;bottom:calc(22px + var(--sab));transform:translateX(-50%);display:flex;gap:20px;pointer-events:auto}
.abc button{width:74px;height:74px;border-radius:50%;border:none;font:700 25px/1 var(--font);color:#2f2140;background:radial-gradient(circle at 35% 30%,#ffffff,#f3eaff 60%,#ddd0f2);box-shadow:0 6px 0 #c4b0e4,0 14px 24px -8px rgba(20,10,40,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.abc button span{font:500 11px/1 var(--font);color:#6f6084}
.abc button:active,.abc button.down{transform:translateY(4px);box-shadow:0 2px 0 #c4b0e4,0 8px 16px -8px rgba(20,10,40,.55)}
.dhint{position:absolute;left:50%;top:calc(66px + var(--sat));transform:translateX(-50%);background:rgba(255,255,255,.92);color:#2f2140;padding:8px 14px;border-radius:99px;font:500 14px/1.3 var(--font);white-space:nowrap;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);transition:opacity .4s}

  .abc{left:auto;right:calc(22px + var(--sar));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;gap:14px}
  .abc button{width:64px;height:64px}

}

/* ---------- dialog ---------- */
#dialog{position:absolute;z-index:15;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);width:min(680px,calc(100vw - 24px));background:var(--panel);border-radius:26px;padding:24px 22px 16px;box-shadow:0 24px 60px -20px rgba(47,33,64,.6);animation:toastIn .3s cubic-bezier(.2,1.3,.4,1);cursor:pointer}
#dialog .who{position:absolute;top:-17px;left:20px;background:var(--who,#ff7aa8);color:#fff;font:600 16px/1 var(--font);padding:9px 16px;border-radius:99px;box-shadow:0 6px 14px -6px rgba(47,33,64,.5)}
#dialog .txt{font:500 18px/1.45 var(--font);min-height:2.9em}
#dialog .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
#dialog .nxt{position:absolute;right:20px;bottom:12px;width:0;height:0;border:8px solid transparent;border-top-color:var(--pink);border-bottom:0;animation:bob 1s infinite}

/* ---------- toasts ---------- */
#toasts{position:absolute;z-index:30;left:50%;top:calc(58px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(460px,92vw)}
.toast{background:rgba(47,33,64,.92);color:#fff;font:500 15px/1.35 var(--font);padding:10px 16px;border-radius:16px;box-shadow:0 10px 24px -12px rgba(0,0,0,.6);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);text-align:center;transition:opacity .4s,transform .4s}
.toast.money{background:linear-gradient(180deg,#ffe592,#ffc94a);color:#4a3200}
.toast.good{background:#38b98f}
.toast.warn{background:#ff6b81}
.toast.out{opacity:0;transform:translateY(-10px)}
.floater{position:absolute;z-index:31;font:400 18px/1 var(--pixel);color:#ffd24a;text-shadow:0 2px 0 #6b4400,0 0 10px rgba(255,200,60,.6);pointer-events:none;animation:floatUp 1.2s ease-out forwards}

/* ---------- creator ---------- */
#creator{position:absolute;inset:0;z-index:12;pointer-events:none}
#creator .cpanel{pointer-events:auto;position:absolute;right:calc(16px + var(--sar));top:calc(16px + var(--sat));bottom:calc(16px + var(--sab));width:min(440px,48vw);display:flex;flex-direction:column;background:var(--panel);border-radius:30px;box-shadow:0 30px 80px -24px rgba(47,33,64,.6)}
#creator .ctop{position:absolute;left:calc(20px + var(--sal));top:calc(18px + var(--sat));pointer-events:auto}

#creator .spin{position:absolute;left:calc(20px + var(--sal));bottom:calc(20px + var(--sab));pointer-events:auto;display:flex;gap:8px}
@media (orientation:portrait){
  #creator .cpanel{left:0;right:0;bottom:0;top:auto;width:auto;height:58%;border-radius:28px 28px 0 0;padding-bottom:var(--sab)}

}
@media (orientation:landscape) and (max-height:540px){#creator .ctop p{display:none}#creator .ctop h2{font-size:22px}}

/* ---------- color picker ---------- */
#picker{position:absolute;z-index:45;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,calc(100vw - 24px));background:var(--panel);border-radius:28px;padding:18px 20px 20px;box-shadow:0 30px 80px -20px rgba(20,10,40,.7);animation:pop .28s cubic-bezier(.2,1.35,.4,1)}
#picker h3{margin:0 0 4px;font:700 21px/1.2 var(--font)}
.wheelwrap{position:relative;width:min(240px,62vw);aspect-ratio:1/1;margin:10px auto 14px;touch-action:none;cursor:crosshair}
.wheelwrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px #fff,0 12px 26px -10px rgba(47,33,64,.55);display:block}
.wheelwrap .knob{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.val{-webkit-appearance:none;appearance:none;width:100%;height:22px;border-radius:99px;outline:none;background:var(--grad,#888)}
.val::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid #2f2140;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.val::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2f2140}
.hexrow{display:flex;gap:10px;align-items:center;margin-top:14px}
.hexrow input{flex:1;min-width:0;font:400 16px/1 var(--pixel);padding:12px;border-radius:14px;border:2px solid var(--stroke);background:var(--tile);color:var(--ink);text-transform:uppercase;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.hexrow .prev{width:46px;height:46px;border-radius:14px;background:var(--sw);box-shadow:0 0 0 2px var(--stroke)}
@media (orientation:portrait) and (max-width:760px){#picker{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;border-radius:28px 28px 0 0;padding-bottom:calc(20px + var(--sab));animation:up .3s}}

/* ---------- decorate ---------- */
#decorBar{position:absolute;z-index:8;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);padding:7px;border-radius:99px;box-shadow:0 12px 28px -14px rgba(47,33,64,.6)}
#decorBar .ttl{font:600 16px/1 var(--font);padding:0 8px 0 12px;white-space:nowrap}
#decorSel{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(178px + var(--sab));display:flex;gap:8px;padding:8px;background:var(--panel);border-radius:24px;box-shadow:0 16px 34px -16px rgba(47,33,64,.65);align-items:center}
#decorSel .nm{font:600 15px/1.2 var(--font);padding:0 6px 0 8px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#decorSel .swatch{width:40px;height:40px;border-radius:13px}
#decorDrawer{position:absolute;z-index:8;left:0;right:0;bottom:0;padding:10px calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -12px 30px -18px rgba(47,33,64,.5)}
#decorDrawer .dtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;touch-action:pan-x;scrollbar-width:none}
#decorDrawer .ditems{display:flex;gap:10px;overflow-x:auto;touch-action:pan-x;padding:2px 2px 4px;min-height:132px;scrollbar-width:thin}
.ditem{flex:0 0 112px;background:var(--tile);border-radius:18px;padding:6px 6px 8px;border:2px solid transparent;cursor:pointer;text-align:center;font-family:var(--font);color:var(--ink);box-shadow:0 2px 0 var(--stroke)}
.ditem img{width:100%;aspect-ratio:1/1;border-radius:13px;background:radial-gradient(circle at 50% 38%,#fff,#efe6fb);object-fit:contain;display:block}
.ditem b{display:block;font:600 13px/1.2 var(--font);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem span{font:500 12px/1 var(--font);color:var(--ink-2)}
.empty{font:400 15px/1.4 var(--font);color:var(--ink-2);padding:24px 8px}
@media (orientation:landscape) and (max-height:540px){#decorDrawer .ditems{min-height:104px}.ditem{flex-basis:92px}#decorSel{bottom:calc(150px + var(--sab))}}

/* ---------- arcade & contest ---------- */
.ovl{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(18,10,34,.72);animation:fade .25s;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab))}
.cab{width:min(520px,94vw);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(180deg,#5a3c9c,#2c1d55);border-radius:30px;padding:18px 18px 22px;box-shadow:0 0 0 6px #241747,0 0 40px rgba(170,120,255,.4)}
.cab h3{margin:0;font:400 22px/1 var(--pixel);color:#ffe9a8;text-shadow:0 0 12px #ff7ad9}
.cab canvas{width:100%;max-height:52vh;aspect-ratio:64/56;object-fit:contain;border-radius:14px;box-shadow:0 0 0 5px #120b26,0 0 28px rgba(120,200,255,.35);image-rendering:pixelated}
.cab .info{display:flex;justify-content:space-between;width:100%;font:400 14px/1 var(--pixel);color:#cfc3ff}
.cab .abc{position:static;transform:none;flex-direction:row}
.cab .abc button{width:68px;height:68px}
@media (orientation:landscape) and (max-height:600px){.cab{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(820px,96vw)}.cab canvas{width:auto;height:min(58vh,330px)}.cab .abc{flex-direction:column}}
.stage{width:min(760px,96vw);max-height:100%;overflow:auto;background:var(--panel);border-radius:30px;padding:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);touch-action:pan-y}
.stage canvas{width:100%;aspect-ratio:160/72;border-radius:18px;image-rendering:pixelated;display:block;background:#2b1d47}
.stage h3{margin:0 0 4px;font:700 24px/1.2 var(--font)}
.stage p{margin:4px 0;font:400 15px/1.45 var(--font);color:var(--ink-2)}
.board{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px 14px;font:500 15px/1.3 var(--font);margin:12px 0;align-items:center}
.board .me{color:#d23c78;font-weight:700}
.meter{position:relative;height:30px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:12px 0}
.meter .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#ffc1d6,#ff7aa8,#ffc1d6)}
.meter .hrt{position:absolute;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#2f2140;box-shadow:0 0 0 3px #fff}
.req{background:var(--tile);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 0 var(--stroke)}
.req b{font:600 16px/1.3 var(--font)}
.req .pb{height:10px;border-radius:99px;background:var(--panel-2);margin:8px 0 4px;overflow:hidden}
.req .pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff97bd,#ff6c9f)}
.req.done .pb i{background:linear-gradient(90deg,#9ff0db,#4cc9a6)}
.req small{font:400 13px/1 var(--font);color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font:400 15px/1.4 var(--font)}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
.help p{font:400 16px/1.55 var(--font);margin:0 0 12px;max-width:62ch}
.help h4{font:600 17px/1.3 var(--font);margin:18px 0 6px}
.keys{display:inline-block;min-width:24px;padding:3px 7px;border-radius:7px;background:var(--panel-2);font:600 13px/1.2 var(--font);text-align:center;box-shadow:0 2px 0 var(--stroke)}
.devcard{display:flex;gap:14px;align-items:center;background:var(--tile);border-radius:22px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 0 var(--stroke)}
.devcard canvas{width:78px;height:68px;border-radius:12px;image-rendering:pixelated;flex:none;box-shadow:0 0 0 4px var(--sw,#ff7aa8)}
.devcard .inf{flex:1;min-width:0}
.devcard .inf b{display:block;font:600 17px/1.25 var(--font)}
.devcard .inf span{display:block;font:400 14px/1.4 var(--font);color:var(--ink-2)}
.devcard .act{display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;font:500 12px/1 var(--font);padding:5px 8px;border-radius:99px;background:#e6fbf4;color:#1f7a5f;margin-left:6px;vertical-align:2px}
.devshop{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.devshop .pv{aspect-ratio:1/1;border-radius:24px;background:radial-gradient(circle at 50% 40%,#fff,#ece3fa);display:grid;place-items:center;overflow:hidden}
.devshop .pv canvas{width:100%;height:100%}
@media (max-width:640px){.devshop{grid-template-columns:1fr}.devshop .pv{max-width:300px;margin:0 auto;width:100%}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <canvas id="world" tabindex="-1"></canvas>

</div>

<script>
(function(){
'use strict';
/* ============================================================
   PAWBBLE — core utilities, audio, storage, color wheel, UI kit
   ============================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');

const buzz=ms=>{try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}};
const IS_TOUCH=(window.matchMedia&&matchMedia('(pointer: coarse)').matches)||('ontouchstart' in window&&navigator.maxTouchPoints>0);
const IS_SMALL=Math.min(screen.width,screen.height)<700;

/* ---------- color helpers ---------- */
function hexToRgb(hx){hx=String(hx||'#000').replace('#','');if(hx.length===3)hx=hx.split('').map(c=>c+c).join('');const n=parseInt(hx,16)||0;return[n>>16&255,n>>8&255,n&255]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function shade(hx,amt){const[r,g,b]=hexToRgb(hx);const t=amt<0?0:255,p=Math.abs(amt);return rgbToHex(r+(t-r)*p,g+(t-g)*p,b+(t-b)*p)}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}

const validHex=s=>/^#?[0-9a-fA-F]{6}$/.test(String(s).trim());

/* ---------- icons ---------- */
const SVG={
 pause:'<svg class="f" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>',
 list:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="3"/><path d="M9 3.5h6v3H9zM8.5 11h7M8.5 15h5"/></svg>',

/* ---------- audio ---------- */
const midi=n=>440*Math.pow(2,(n-69)/12);
const SFX=(()=>{
  let ctx=null,master,sfx,music,noiseBuf;
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){return}
    master=ctx.createGain();master.connect(ctx.destination);
    sfx=ctx.createGain();sfx.connect(master);music=ctx.createGain();music.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    apply();
  }
  function apply(){if(!ctx)return;master.gain.value=SET.master;sfx.gain.value=SET.sfx;music.gain.value=SET.music*0.5}
  function tone(f,d=0.1,type='square',v=0.12,when=0,slide=0,dest){
    if(!ctx)return;const t=ctx.currentTime+when;const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+d+0.03);
  }
  function noise(d=0.05,v=0.1,f=4000,when=0,type='highpass'){
    if(!ctx)return;const t=ctx.currentTime+when;const s=ctx.createBufferSource();s.buffer=noiseBuf;
    const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ctx.createGain();
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(sfx);s.start(t,Math.random()*0.5);s.stop(t+d+0.03);
  }
  return{
    init,apply,tone,noise,get ctx(){return ctx},get musicNode(){return music},
    beep(){tone(2093,0.06,'square',0.05)},
    tick(){tone(1568,0.035,'square',0.035)},
    click(){tone(700,0.04,'triangle',0.11);noise(0.02,0.04,3000)},
    pop(){tone(520,0.1,'sine',0.16,0,1.9)},
    open(){tone(440,0.08,'sine',0.11);tone(660,0.11,'sine',0.11,0.06)},
    close(){tone(620,0.07,'sine',0.09);tone(420,0.1,'sine',0.09,0.05)},
    cash(){tone(1318,0.07,'square',0.05);tone(1760,0.22,'square',0.05,0.07);noise(0.1,0.05,6000,0.02)},
    coin(){tone(988,0.05,'square',0.045);tone(1319,0.12,'square',0.045,0.05)},
    err(){tone(220,0.13,'square',0.06);tone(170,0.18,'square',0.06,0.11)},
    call(){[0,0.2,0.4].forEach(w=>{tone(1760,0.08,'square',0.06,w);tone(2093,0.08,'square',0.06,w+0.09)})},
    jingle(seq,type='square',vol=0.05){let w=0;seq.forEach(([n,d])=>{if(n)tone(midi(n),d*0.92,type,vol,w);w+=d})},
    step(){noise(0.05,0.03,700,0,'lowpass')},
    door(){tone(300,0.12,'triangle',0.1);noise(0.12,0.05,700,0,'lowpass')},
    eat(){tone(330,0.05,'square',0.04);tone(220,0.05,'square',0.04,0.09)},
    hop(){tone(380,0.12,'sine',0.1,0,1.8)},
    place(){tone(260,0.08,'triangle',0.13);noise(0.06,0.06,500,0,'lowpass')}
  };
})();
const Music=(()=>{
  let on=false,timer=null,next=0,step=0,phrase=[],filt=null;
  const BPM=76,SPB=60/BPM/2;
  const prog=[[48,[60,64,67,71]],[45,[57,60,64,67]],[41,[57,60,65,69]],[43,[55,59,62,67]]];
  const scale=[72,74,76,79,81,84,86,88];
  function mk(){const p=[];let i=randi(1,4);for(let s=0;s<32;s++){if((s%2===0&&Math.random()<0.45)||Math.random()<0.1){i=clamp(i+randi(-2,2),0,scale.length-1);p.push(scale[i])}else p.push(0)}return p}
  function voice(f,t,d,v,type,attack){const ctx=SFX.ctx;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(filt);o.start(t);o.stop(t+d+0.05)}
  function play(s,t){
    const bar=Math.floor(s/8)%4,[root,ch]=prog[bar];
    if(s%8===0){ch.forEach(n=>{voice(midi(n),t,SPB*8.4,0.018,'triangle',0.5);voice(midi(n)*1.003,t,SPB*8.4,0.012,'sine',0.6)});voice(midi(root-12),t,SPB*3.6,0.07,'sine',0.02)}
    if(s%8===4)voice(midi(root-5),t,SPB*3,0.05,'sine',0.02);
    const m=phrase[s%32];if(m)voice(midi(m),t,0.55,0.045,'triangle',0.004);
    if(s%4===2){const ctx=SFX.ctx;const src=ctx.createBufferSource();src.buffer=ctx.createBuffer(1,2205,44100);const d=src.buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const g=ctx.createGain();g.gain.value=0.012;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;src.connect(hp);hp.connect(g);g.connect(filt);src.start(t)}
  }
  function sched(){const ctx=SFX.ctx;if(!ctx||!on)return;while(next<ctx.currentTime+0.3){play(step,next);next+=SPB;step=(step+1)%64;if(step%32===0&&Math.random()<0.6)phrase=mk()}}
  return{
    start(){const ctx=SFX.ctx;if(!ctx||on)return;on=true;if(!filt){filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=2400;filt.connect(SFX.musicNode)}phrase=mk();next=ctx.currentTime+0.1;timer=setInterval(sched,90)},
    stop(){on=false;clearInterval(timer)},
    mood(night){if(filt)filt.frequency.setTargetAtTime(night?1100:2400,SFX.ctx.currentTime,1.5)}
  };
})();

/* ---------- storage (local + per-person cloud) ---------- */
const Store=(()=>{
  const LK='pawbble.slot.v1.';
  let db=null,uidv=null,ready=false;const busy={},pend={};
  const listeners=[];
  async function initCloud(){
    try{
      if(!window.claude||typeof window.claude.use!=='function')return;
      const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!d||!u)return;const id=await u.id();if(!id)return;
      db=d;uidv=id;ready=true;listeners.forEach(f=>f());
    }catch(e){console.warn('cloud unavailable',e)}
  }
  const ref=i=>db.doc('data/users/'+uidv+'/slot'+i);
  function lget(i){try{const s=localStorage.getItem(LK+i);return s?JSON.parse(s):null}catch(e){return null}}
  function lset(i,d){try{localStorage.setItem(LK+i,JSON.stringify(d));return true}catch(e){return false}}
  async function cget(i){if(!ready)return null;try{const s=await ref(i).get();if(!s.exists)return null;const d=s.data();return d&&d.json?JSON.parse(d.json):null}catch(e){return null}}
  async function cset(i,data){
    if(!ready)return false;if(busy[i]){pend[i]=data;return true}
    busy[i]=true;let ok=true;
    try{await ref(i).set({json:JSON.stringify(data),updated:data.updated||Date.now()})}catch(e){ok=false;console.warn('cloud save failed',e&&e.code)}
    busy[i]=false;if(pend[i]){const n=pend[i];pend[i]=null;cset(i,n)}return ok;
  }
  return{
    initCloud,get cloud(){return ready},onCloud(f){listeners.push(f)},
    local:lget,
    async load(i){const a=lget(i),b=await cget(i);if(a&&b)return(b.updated||0)>(a.updated||0)?b:a;return a||b},
    saveLocal(i,d){return lset(i,d)},saveCloud:cset,
    async del(i){try{localStorage.removeItem(LK+i)}catch(e){}if(ready){try{await ref(i).delete()}catch(e){}}},
    async list(){const out=[];for(let i=1;i<=3;i++)out.push(lget(i));if(ready){await Promise.all([1,2,3].map(async i=>{const c=await cget(i);if(c&&(!out[i-1]||(c.updated||0)>(out[i-1].updated||0)))out[i-1]=c}))}return out}
  };
})();

/* ---------- UI kit: sheets, toasts, confirm ---------- */
const LAYER=$('#layer');
const UI={
  stack:[],
  sheet({title,sub='',size='',body='',foot=false,onClose=null,noClose=false,cls=''}){
    const scrim=h('<div class="scrim"></div>');
    const el=h(`<section class="sheet ${size} ${cls}" role="dialog" aria-label="${esc(title)}"><div class="sh-head"><div class="tt"><h2>${esc(title)}</h2>${sub?`<p class="sh-sub">${sub}</p>`:''}</div>${noClose?'':`<button class="btn icon" data-x aria-label="Close">${SVG.close}</button>`}</div><div class="sh-body"></div>${foot?'<div class="sh-foot"></div>':''}</section>`);
    const bodyEl=el.querySelector('.sh-body');if(typeof body==='string')bodyEl.innerHTML=body;else if(body)bodyEl.appendChild(body);
    LAYER.appendChild(scrim);LAYER.appendChild(el);
    const entry={el,scrim,body:bodyEl,foot:el.querySelector('.sh-foot'),onClose,noClose,close:()=>UI.close(entry)};
    if(!noClose){scrim.addEventListener('click',()=>entry.close());el.querySelector('[data-x]').addEventListener('click',()=>{SFX.close();entry.close()})}
    UI.stack.push(entry);SFX.open();return entry;
  },
  close(entry){const i=UI.stack.indexOf(entry);if(i<0)return;UI.stack.splice(i,1);entry.el.remove();entry.scrim.remove();if(entry.onClose)entry.onClose()},
  closeTop(){const e=UI.stack[UI.stack.length-1];if(e&&!e.noClose){SFX.close();e.close();return true}return false},
  closeAll(){while(UI.stack.length){const e=UI.stack.pop();e.el.remove();e.scrim.remove();if(e.onClose)e.onClose()}},
  get open(){return UI.stack.length>0}
};
function toast(msg,cls=''){
  const box=$('#toasts');const t=h(`<div class="toast ${cls}"></div>`);t.textContent=msg;box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),420)},cls==='money'?1700:2900);
}
function floatMoney(n){
  const anchor=$('#moneyTxt');if(!anchor||$('#hud').classList.contains('hidden'))return;
  const r=anchor.getBoundingClientRect();const f=h(`<div class="floater">+${fmt(n)}</div>`);
  f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.bottom+6)+'px';$('#app').appendChild(f);setTimeout(()=>f.remove(),1300);
}
function confirmBox(title,text,ok,cb,okCls='pri'){
  const s=UI.sheet({title,sub:text,size:'sm',foot:true});
  const no=h('<button class="btn">Cancel</button>'),yes=h(`<button class="btn ${okCls}">${esc(ok)}</button>`);
  no.onclick=()=>{SFX.close();s.close()};yes.onclick=()=>{SFX.click();s.close();cb()};
  s.foot.append(no,yes);s.body.remove();return s;
}

/* ---------- color wheel ---------- */
const Picker=(()=>{
  const SW=['#ff7aa8','#ffb3c7','#ff9178','#ffd56b','#fff1a8','#b8f2a0','#7fdcc4','#9fd3ff','#8fa8ff','#c6a8ff','#f5c6ff','#ffffff','#e7e0ef','#a99bbb','#5b4a70','#2f2140'];
  let el=null,scrim=null,hsv=[330,0.5,1],onInput=null,onDone=null,cv,knob,shadeEl,valIn,hexIn,prev,swBox,recBox,raf=0,dirty=false,entry=null;
  function build(){
    scrim=h('<div class="scrim" style="z-index:44"></div>');
    el=h(`<div id="picker" role="dialog" aria-label="Color wheel"><h3 id="pkTitle">Pick a color</h3>
      <div class="wheelwrap"><canvas width="220" height="220"></canvas><div class="shade" style="position:absolute;inset:0;border-radius:50%;background:#000;pointer-events:none"></div><div class="knob"></div></div>
      <input class="val" type="range" min="6" max="100" value="100" aria-label="Brightness">
      <div class="lbl" style="margin-top:12px">Quick colors</div><div class="quick" id="pkSw"></div>
      <div class="lbl" id="pkRecL">Recent</div><div class="quick" id="pkRec"></div>
      <div class="hexrow"><div class="prev"></div><input type="text" maxlength="7" aria-label="Hex color" spellcheck="false"><button class="btn pri" id="pkDone">Done</button></div></div>`);
    cv=el.querySelector('canvas');knob=el.querySelector('.knob');shadeEl=el.querySelector('.shade');valIn=el.querySelector('.val');hexIn=el.querySelector('.hexrow input');prev=el.querySelector('.prev');swBox=el.querySelector('#pkSw');recBox=el.querySelector('#pkRec');
    const ctx=cv.getContext('2d'),s=cv.width,img=ctx.createImageData(s,s),d=img.data,r=s/2;
    for(let y=0;y<s;y++)for(let x=0;x<s;x++){const dx=x+.5-r,dy=y+.5-r,dist=Math.sqrt(dx*dx+dy*dy),i=(y*s+x)*4;if(dist>r){d[i+3]=0;continue}const[R,G,B]=hsvToRgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,Math.min(1,dist/r),1);d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=dist>r-1.3?Math.round(255*(r-dist)/1.3):255}
    ctx.putImageData(img,0,0);
    const wrap=el.querySelector('.wheelwrap');let drag=false;
    const fromP=e=>{const b=cv.getBoundingClientRect(),rr=b.width/2,dx=e.clientX-b.left-rr,dy=e.clientY-b.top-rr;hsv[0]=(Math.atan2(dy,dx)*180/Math.PI+360)%360;hsv[1]=Math.min(1,Math.hypot(dx,dy)/rr);if(hsv[2]<0.2)hsv[2]=0.9;upd(true)};
    wrap.addEventListener('pointerdown',e=>{drag=true;try{wrap.setPointerCapture(e.pointerId)}catch(_){}fromP(e)});
    wrap.addEventListener('pointermove',e=>{if(drag)fromP(e)});
    const end=()=>{drag=false};wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
    valIn.addEventListener('input',()=>{hsv[2]=valIn.value/100;upd(true)});
    hexIn.addEventListener('change',()=>{let v=hexIn.value.trim();if(!v.startsWith('#'))v='#'+v;if(validHex(v)){setHex(v);upd(true)}else upd(false)});
    hexIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')hexIn.blur()});
    el.querySelector('#pkDone').onclick=()=>{SFX.click();close(true)};
    scrim.addEventListener('click',()=>close(true));
  }
  function setHex(hx){const[r,g,b]=hexToRgb(hx);hsv=rgbToHsv(r,g,b)}
  function cur(){return rgbToHex(...hsvToRgb(hsv[0],hsv[1],hsv[2]))}
  function swatches(list,box){box.innerHTML='';list.forEach(c=>{const i=h(`<i style="--sw:${c}" title="${c}" role="button" aria-label="${c}"></i>`);i.onclick=()=>{setHex(c);upd(true);SFX.tick()};box.appendChild(i)})}
  function upd(fire){
    const rr=cv.clientWidth/2||110,a=hsv[0]*Math.PI/180;
    knob.style.transform=`translate(${rr+Math.cos(a)*hsv[1]*rr}px,${rr+Math.sin(a)*hsv[1]*rr}px)`;
    const hx=cur();knob.style.background=hx;shadeEl.style.opacity=(1-hsv[2]).toFixed(3);
    valIn.value=Math.round(hsv[2]*100);valIn.style.setProperty('--grad',`linear-gradient(90deg,#000,${hsvHex(hsv[0],hsv[1],1)})`);
    if(document.activeElement!==hexIn)hexIn.value=hx.toUpperCase();prev.style.background=hx;
    if(fire&&onInput){dirty=true;if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(dirty&&onInput){dirty=false;onInput(cur())}})}
  }
  function open(o){
    if(!el)build();onInput=o.onInput||null;onDone=o.onDone||null;setHex(o.value||'#ff7aa8');
    el.querySelector('#pkTitle').textContent=o.title||'Pick a color';
    swatches(o.swatches||SW,swBox);const rec=(SET.recent||[]).slice(0,8);el.querySelector('#pkRecL').style.display=rec.length?'':'none';swatches(rec,recBox);
    LAYER.appendChild(scrim);LAYER.appendChild(el);entry={el,scrim,close:()=>close(true)};UI.stack.push(entry);
    requestAnimationFrame(()=>upd(false));SFX.open();
  }
  function close(done){
    if(!el||!el.isConnected)return;el.remove();scrim.remove();const i=UI.stack.indexOf(entry);if(i>=0)UI.stack.splice(i,1);
    const c=cur();if(done){SET.recent=[c].concat((SET.recent||[]).filter(x=>x!==c)).slice(0,8);saveSettings();if(onInput)onInput(c);if(onDone)onDone(c)}
  }
  return{open,close,SW};
})();

    if(!S.req||S.req.day!==S.day)Req.gen();this.startPlay();if(away>30)toast('Welcome back! Time kept ticking while you were away.')},
  startPlay(){OSM.clear();UI.closeAll();$('#menu').classList.add('hidden');if(SCN.home)SCN.home.scene.traverse(o=>{if(o.geometry&&!o.geometry.userData.cached)o.geometry.dispose()});SCN.home=buildHome();
    CUR=SCN[S.scene]&&S.scene!=='home'?S.scene:'home';buildPlayer();if(P.c.root.parent)P.c.root.parent.remove(P.c.root);SCN[CUR].scene.add(P.c.root);P.pos.set(S.pos.x,0,S.pos.z);if(CUR==='home'){P.pos.x=clamp(P.pos.x,-7.5,7.5);P.pos.z=clamp(P.pos.z,-5.5,5.5)}
    CAM.yaw=0;CAM.pitch=CUR==='town'?.36:.88;CAM.dist=CUR==='town'?7.5:11.5;CAM.snap=true;G.state='play';G.paused=false;G.devOpen=false;Dev.setMode('off');Dev.setActive();
    $('#hud').classList.remove('hidden');$('#btnDecor').classList.toggle('hidden',CUR!=='home');applyTouch();Req.mini();applyTime(S.clock,true);areaName(SCN[CUR].label);SFX.init();Music.start();HUD.m=HUD.c=HUD.a=null;
    if(!S.tut){setTimeout(()=>Dlg.open('Welcome home','#ff7aa8',[`Hi ${S.look.name}! This is your new home in Pebble Town.`,'Your pet lives on the egg device. Open it with '+(IS_TOUCH?'the egg button in the corner':'Tab or the egg in the corner')+'. Your egg is about to hatch!','On the device, A moves between icons, B uses one and C goes back. Every bit of care earns money.','Spend it on newer devices at Tama Toys, furniture at Nest & Co., and treats at Bubble Café. Have fun!'],[],()=>{S.tut=1;Game.save()}),700)}},
  save(cloud){if(!S||G.state==='menu')return;S.updated=Date.now();S.scene=CUR;S.pos={x:+P.pos.x.toFixed(2),z:+P.pos.z.toFixed(2)};const data=JSON.parse(JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v));Store.saveLocal(SLOT,data);const now=Date.now();if(cloud||now-G.lastCloud>60000){G.lastCloud=now;Store.saveCloud(SLOT,data)}},
  quit(){Dev.close();if(G.decor)Decor.exit();Dlg.close();Arcade.on&&Arcade.close();G.state='menu';$('#hud').classList.add('hidden');$('#labels').querySelectorAll('.bubble').forEach(b=>b.remove());if(P.c&&P.c.root.parent)P.c.root.parent.remove(P.c.root);CUR='town';Menu.show()}};

/* ---------- main menu ---------- */
const Menu={demo:null,
  async show(){G.state='menu';$('#menu').classList.remove('hidden');$('#hud').classList.add('hidden');CUR='town';applyTime(1050,true);
    if(!this.demo){const dev={id:'demo',model:'pop',shell:{c:'#ff7aa8',p:'dots',pc:'#ffffff'},pet:{sp:'floof',st:'adult',form:'bright',col:'#fbfaff',hu:4,ha:4,poop:1,lights:true}};this.demo=new DeviceOS(dev,true);this.demo.dev=dev}
    const t=new THREE.CanvasTexture(this.demo.L.cv);t.encoding=THREE.sRGBEncoding;this.demo.L.subs=[()=>{t.needsUpdate=true}];if(Dev.model)Dev.root.remove(Dev.model.g);Dev.tex=t;Dev.model=buildDevice('pop',this.demo.dev.shell,'carrot',{tex:t,detail:1});Dev.root.add(Dev.model.g);Dev.setMode('menu');
    const list=await Store.list();const latest=list.map((d,i)=>d?{d,i:i+1}:null).filter(Boolean).sort((a,b)=>(b.d.updated||0)-(a.d.updated||0))[0];const box=$('#menuBtns');box.innerHTML='';
    const add=(label,cls,fn,sub)=>{const b=h(`<button class="btn ${cls}">${label}${sub?`<small>${esc(sub)}</small>`:''}</button>`);b.onclick=()=>{SFX.init();SFX.click();fn()};box.appendChild(b)};
    if(latest)add('Continue','pri',()=>Game.load(latest.i),(latest.d.look&&latest.d.look.name||'')+', day '+latest.d.day);add('New game',latest?'':'pri',()=>Panels.slots('new'));if(latest)add('Load game','',()=>Panels.slots('load'));add('Settings','',()=>Panels.settings());add('How to play','',()=>Panels.help());
    $('#menuFoot').innerHTML=Store.cloud?`<span class="cloud">${SVG.cloud}Saves sync to your account</span>`:'Your game saves on this device.'}};

/* ---------- loop ---------- */
let lastT=performance.now(),TT=0;
function resize(){const w=innerWidth,hh=innerHeight;WR.setPixelRatio(PR());WR.setSize(w,hh,false);DR.setPixelRatio(Math.min(window.devicePixelRatio||1,2));DR.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();Dev.layout();if(!Joy.on)placeJoyHint()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')Game.save(true)});
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-lastT)/1000)||.016;lastT=now;TT+=dt;try{tick(dt)}catch(e){console.error(e)}}
function tick(dt){
  if(G.state==='loading')return;
  if(G.state==='menu'){const T=SCN.town;T.update(dt,TT);NPCs.update(dt,TT);camUpdate(dt,TT);WR.render(T.scene,camera);if(Menu.demo){const o=Menu.demo;o.T+=dt;G.lcdT-=dt;if(G.lcdT<=0){G.lcdT=1/12;o.x=32+Math.round(Math.sin(TT*.8)*12);o.dir=Math.cos(TT*.8)>0?1:-1;o.draw()}}Dev.update(dt,TT);Dev.render();return}
  if(G.state==='creator'){Creator.update(dt,TT);WR.render(Creator.scene,Creator.cam);Dev.update(dt,TT);Dev.render();return}
  if(!G.paused){gameTime(dt);const d=activeDev();if(d){petTick(d,dt,S.clock>=1260||S.clock<420,false);if(d.pet&&d.pet.call){G.callBeep-=dt;if(G.callBeep<=0){G.callBeep=9;SFX.call()}}}if(P.boost<=0)G.drink=0;else G.drink=P.boost}
  const d=activeDev();if(d){const os=osFor(d);os.update(dt);G.lcdT-=dt;if(G.lcdT<=0){G.lcdT=1/12;os.draw()}}
  playerUpdate(dt,TT);SCN[CUR].update(dt,TT);NPCs.update(dt,TT);camUpdate(dt,TT);Inter.update();Dlg.tick(dt);Arcade.update(dt);
  if(CUR==='town')applyTime(S.clock);else{applyTime(S.clock)}
  WR.render(SCN[CUR].scene,camera);if(G.devOpen){Dev.update(dt,TT);Dev.render()}HUD.update();
  G.saveT+=dt;if(G.saveT>30){G.saveT=0;Game.save()}}

/* ---------- boot ---------- */
async function boot(){
  const icons={btnReq:SVG.list,btnDecor:SVG.sofa,btnPause:SVG.pause,actBtn:SVG.hand,hopBtn:SVG.up,runBtn:SVG.bolt};for(const k in icons)$('#'+k).innerHTML=icons[k];
  $('#btnReq').onclick=()=>{SFX.click();Panels.requests()};$('#btnDecor').onclick=()=>{SFX.click();Decor.enter()};$('#btnPause').onclick=()=>{SFX.click();Panels.pause()};$('#devBtn').onclick=()=>Dev.open();$('#reqMini').onclick=()=>Panels.requests();
  $('#actBtn').addEventListener('pointerdown',e=>{e.preventDefault();Inter.use()});$('#hopBtn').addEventListener('pointerdown',e=>{e.preventDefault();hop()});$('#runBtn').addEventListener('pointerdown',e=>{e.preventDefault();P.run=!P.run;$('#runBtn').classList.toggle('on',P.run)});$('#prompt').onclick=()=>Inter.use();
  try{await Promise.race([document.fonts.load('700 48px Fredoka'),new Promise(r=>setTimeout(r,2500))]);await document.fonts.load('400 16px Silkscreen').catch(()=>{})}catch(e){}
  $('#loadTxt').textContent='Building Pebble Town…';await new Promise(r=>setTimeout(r,30));
  SCN.town=buildTown();buildShops();NPCs.spawnTown();Dev.init();Creator.init();resize();applyTime(1050,true);
  Store.onCloud(()=>{if(G.state==='menu')Menu.show()});Store.initCloud();
  G.state='menu';await Menu.show();const L=$('#loading');L.style.opacity=0;setTimeout(()=>L.remove(),500);requestAnimationFrame(frame)}
boot().catch(e=>{console.error(e);$('#loadTxt').textContent='Something went wrong while loading. Try reloading the page.'});
})();

</script>
